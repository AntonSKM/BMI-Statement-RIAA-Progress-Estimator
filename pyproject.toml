[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmi-statement-riaa-progress-estimator"
version = "1.0.0"
description = "Estimate streaming-equivalent RIAA progress from selected BMI statement performance rows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anton S. Kunstmann"}]
dependencies = ["pandas>=2.0,<3"]

[project.scripts]
riaa-progress = "riaa_progress.cli:main"

[tool.setuptools]
packages = ["riaa_progress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
